# Local development database. The app and tests both talk to this Postgres;
# production uses a hosted Postgres (see docs/deployment.md).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salary_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
